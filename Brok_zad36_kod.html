<textarea cols="100" rows="30">
<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <title>Z36 - Brokos</title>
</head>
<body>
<script>
    var x = prompt("Podaj liczbę:", "");
    var liczba = parseInt(x);

    document.write("Czytana liczba: " + liczba + "<br>");

    if (liczba % 2 == 0) {
        document.write("<font color='silver' size='5'>liczba jest parzysta</font><br>");
    } else {
        document.write("<font color='red' size='3'>liczba jest nieparzysta</font><br>");
    }
</script>
</body>
</html>
</textarea>
