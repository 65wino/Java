<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="utf-8">
    <title>Brok_zad13</title>
</head>
<body>
    <div id="wynik" class="box"></div>

    <script>
        function obliczUlamki() {
            var m = parseInt(prompt("Podaj mianownik m:"));

            if (isNaN(m) || m <= 0) {
                document.getElementById("wynik").innerHTML = "Podaj liczbę większą od zera.";
                return;
            }

            var drugiMianownik = m + 1;
            var wynikMianownik = m * drugiMianownik;

            document.getElementById("wynik").innerHTML =
                "1/" + m + " + 1/" + drugiMianownik + " = 1/" + wynikMianownik +
                "<br><br>" +
                "Czyli: 1/" + m + " = 1/" + drugiMianownik + " + 1/" + wynikMianownik;
        }

        window.onload = obliczUlamki;
    </script>
</body>
</html>
