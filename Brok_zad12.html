<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="utf-8">
    <title>Brok_zad12</title>
    <script type="text/javascript">
        var D1_bro = parseInt(prompt("Podaj D1_bro:", ""));
        var D2_bro = parseInt(prompt("Podaj D2_bro:", ""));
        var G1_bro = parseInt(prompt("Podaj G1_bro:", ""));
        var G2_bro = parseInt(prompt("Podaj G2_bro:", ""));

        var sekundy = Math.abs((D1_bro * 24 + G1_bro) - (D2_bro * 24 + G2_bro)) * 3600;

        document.write("D1=" + D1_bro + "<br>");
        document.write("G1=" + G1_bro + "<br>");
        document.write("D2=" + D2_bro + "<br>");
        document.write("G2=" + G2_bro + "<br><br>");
        document.write("ilość sekund = " + sekundy + " sekund");
    </script>
</head>
<body>
</body>
</html>
