<!DOCTYPE html>
<html lang="pl-PL">
<head>
  <meta charset="utf-8">
  <title>Osadzanie pliku JS - Brokos</title>
</head>
<body>

    <script>
document.write("1) kiedy powstał JavaScript .<br>");
document.write("1995 r.<br><br>");

document.write("2) dlaczego jest to język skryptowy<br>");
document.write("bo służy do wykonywania instrukcji w przeglądarce i nie musi być kompilowany do osobnego pliku wykonywalnego.<br><br>");

document.write("3) gdzie jest wykonywany JS <br>");
document.write("po stronie klienta, czyli w przeglądarce.<br><br>");

document.write("4) dlaczego jest JS to bezpieczne narzędzie<br>");
document.write("bo działa w ograniczonym środowisku przeglądarki i ma ograniczony dostęp do systemu.<br><br>");

document.write("5) czy jest to język obiektowy, jeśli tak to dlaczego.<br>");
document.write("tak, bo opiera się na obiektach i prototypach.<br><br>");

document.write("6) wymień zalety JS:<br>");
document.write("Zaleta 1 - szybka i prosta obsługa strony<br>");
document.write("Zaleta 2 - działa w przeglądarce bez instalacji<br>");
document.write("Zaleta 3 - łatwa integracja z HTML i CSS<br><br>");

document.write("7) Framework to:<br>");
document.write("to zestaw gotowych narzędzi i bibliotek ułatwiających tworzenie aplikacji.<br><br>");

document.write("8) Do aplikacji mobilnych można użyć Framework<br>");
document.write("tak, np. React Native lub Ionic.<br><br>");

document.write("9) Aplikacje responsywne to:<br>");
document.write("aplikacje, które dostosowują się do rozmiaru ekranu urządzenia.<br>");

document.write("10) Przepisz linie kodu pod nimi wytłumaczenie jak działa ten fragment kodu<br>");
document.write("<input type='button' name='przycisk' value='Nowa Strona' onclick='WinOpen('')'><br>");
document.write("Wyjaśnienie: kliknięcie przycisku wywołuje funkcję WinOpen(), która otwiera nowe okno.<br><br>");

document.write("11) Przepisz linie kodu pod nimi wytłumaczenie jak działa ten fragment kodu<br>");
document.write("window.open('obraz.html','okno','toolbar=no,directories=no,menubar=no,height=280,width=160,top=200,left=200');<br>");
document.write("Wyjaśnienie: otwiera nowe okno o nazwie okno, bez paska narzędzi, katalogów i menu, o rozmiarze 280x160 i położeniu 200px od góry oraz 200px od lewej strony.<br>");
document.write("toolbar=no -> wyłącza pasek narzędzi<br>");
document.write("directories=no -> wyłącza katalogi<br>");
document.write("menubar=no -> wyłącza pasek menu<br>");
document.write("height=280 -> wysokość okna<br>");
document.write("width=160 -> szerokość okna<br>");
document.write("top=200 -> odległość od góry<br>");
document.write("left=200 -> odległość od lewej strony<br><br>");

document.write("12) Opisz następującą instrukcję window.close()<br>");
document.write("window.close() zamyka aktualne okno przeglądarki.<br><br>");
</script>
  
</body>
</html>
