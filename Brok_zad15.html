<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="utf-8">
    <title>Brok_zad15</title>
</head>
<body>
    <div id="wynik" class="box"></div>

    <script>
        function obliczUlamki() {
            var m = parseInt(prompt("Podaj mianownik m:"));

            if (isNaN(m) || m <= 0) {
                document.getElementById("wynik").innerHTML = "Podaj liczbę większą od zera.";
                return;
            }

            var a = 2 * m;

            document.getElementById("wynik").innerHTML =
                "1/" + m + " = 1/" + a + " + 1/" + a;
        }

        window.onload = obliczUlamki;
    </script>
</body>
</html>
