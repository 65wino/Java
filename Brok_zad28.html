  <title>Osadzanie pliku JS - Brokos</title>

<body>

    <script>
document.write("1) Rodzaje filozofii programowania.<br>");
document.write("Programowanie strukturalne i programowanie obiektowe.<br><br>");

document.write("2)Opisz paradygmat programowania strukturalnego. Założenia programowania strukturalnego.<br>");
document.write("Paradygmat programowania opierający się na podziale kodu źródłowego programu na procedury i hierarchicznie ułożone bloki z wykorzystaniem struktur kontrolnych w postaci instrukcji wyboru i pętli.  Programowanie strukturalne zwiększa czytelnośd i ułatwia analizę programów, co stanowi znaczącą poprawę w stosunku do trudnego w utrzymaniu „spaghetti code” często wynikającego z użycia instrukcji goto..<br><br>");

document.write("3)Programowanie obiektowe: definicja (angielski skrót, obiekty, stan, zachowanie, koocowa konkluzja czym jest programowanie obiektowe).<br>");
document.write("Programowanie obiektowe jest to podejście bardziej naturalne dla ludzi, bardziej zgodne z rzeczywistością. W pamięci komputera tworzona jest wirtualna rzeczywistośd. Definiowane (powoływane są do wirtualnego życia w pamięci komputera) obiekty na podstawie wcześniej zdefiniowanych  klas. Obiekty mają zdefiniowane metody oraz pola. <br><br>");

document.write("4)Dlaczego stosujemy programowanie obiektowe? <br>");
document.write("Jest to bardziej naturalne podejście przez programistę podczas tworzenia programów ponieważ otaczający nas świat to różnego rodzaju przedmioty. Tworząc program komputerowy dokonujemy pewnego ich odwzorowania rzeczywistości np. definiujemy obiekt samochód.Programowanie obiektowe pozwala na lepsze gospodarowanie pamięciom komputera, ponieważ gdy obiekt staje się zbędny możemy go usunąd co zwolni pamięd zajmowaną przez ten obiekt.W programowaniu obiektowym dobrze napisana i przetestowana klasa pozwala na stosowaniu przez innych programistów. Zaoszczędza to czas i środki pieniężne. <br><br>");

document.write("5) Omów następujące pojęcia.<br>");
document.write("Klasa- to szablon, na podstawie którego tworzone są obiekty.<br><br>Obiekt- to instancja klasy, która ma swoje właściwości i zachowania.<br><br>Metoda- to funkcja zdefiniowana w klasie, która opisuje zachowanie obiektu.<br><br>Pole- to zmienna zdefiniowana w klasie, która przechowuje dane obiektu.<br><br>Konstruktor- to specjalna metoda wywoływana podczas tworzenia obiektu klasy.<br><br>Dziedziczenie- to mechanizm pozwalający tworzyć nowe klasy na podstawie istniejących, dziedzicząc ich właściwości i zachowania.<br><br>Hermetyzacja- to zasada ukrywania szczegółów implementacji klasy i umożliwienie dostępu do nich tylko przez zdefiniowane metody.<br><br>Polimorfizm- to zdolność obiektów różnych klas do reagowania na tę samą wiadomość w różne sposoby.<br><br>");

</script>
